# API 试炼场 · nginx vhost 模板
# 数据来源：https://github.com/public-apis/public-apis (MIT License)
#
# 本文件是「模板」，占位符由 deploy/install.sh 自动替换：
#     __DOMAIN__        主域名
#     __DOMAIN_ALT__    可选别名域名（留空则只保留主域名）
#     __SSLCERT__       SSL 证书路径（Let's Encrypt，或自签）
#     __SSLKEY__        SSL 私钥路径
#     /opt/public-apis-playground   部署根目录（替换为实际路径）
#
# 说明：本文件是「新增」的 vhost，不改动服务器上已有的站点配置。
# 校验：nginx -t   →   生效：nginx -s reload
#
# 签证书二选一（详见 deploy/README.md 第五节）：
#   A. 80 端口可被 Let's Encrypt 访问 → webroot：
#        certbot certonly --webroot -w /var/www/certbot -d __DOMAIN__
#   B. 80 被云厂商拦截（如境内 ICP 备案拦截）→ TLS-ALPN-01（走 443，绕开 80）：
#        acme.sh --issue --alpn -d __DOMAIN__ --server letsencrypt \
#                --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#        acme.sh --install-cert -d __DOMAIN__ --ecc \
#                --fullchain-file /etc/nginx/ssl/__DOMAIN__.crt \
#                --key-file /etc/nginx/ssl/__DOMAIN__.key \
#                --reloadcmd "nginx -t && systemctl reload nginx"
# 跑 install.sh 时会自动探测 /etc/letsencrypt/live/__DOMAIN__/，
# 找不到就生成一份自签证书先顶上（浏览器会提示不安全，点继续访问即可）。

# 单页约 500 KB，gzip 后约 115 KB
gzip              on;
gzip_min_length   1k;
gzip_comp_level   6;
gzip_types        text/plain text/css application/json application/javascript
                  text/javascript application/xml image/svg+xml;
gzip_vary         on;

# ================================================================
# 80：ACME 挑战 + 直接提供页面
#   暂不做 http→https 强制跳转：证书还没签下来时，301 到 https
#   会因证书不匹配而报错。证书就绪后打开文件末尾那段即可。
# ================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name __DOMAIN__ __DOMAIN_ALT__;

    access_log  /var/log/nginx/__DOMAIN__.access.log;
    error_log   /var/log/nginx/__DOMAIN__.error.log;

    # certbot webroot 挑战目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root  /opt/public-apis-playground/site;
    index index.html;
    charset utf-8;

    # ---------- 跨域代理：交给 serve.py ----------
    location = /api/proxy {
        proxy_pass         http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;      # 上游接口最慢约 5.5s，留足余量
        proxy_buffering       off;
        add_header         Cache-Control "no-store" always;
    }

    # ---------- Python 源码可直接下载 ----------
    location /scripts/ {
        alias      /opt/public-apis-playground/scripts/;
        autoindex  on;
        autoindex_exact_size off;
        autoindex_localtime  on;
        types { text/plain py; }
        default_type text/plain;
        charset utf-8;
    }

    # ---------- 数据集下载 ----------
    location /data/ {
        alias      /opt/public-apis-playground/data/;
        autoindex  on;
        autoindex_exact_size off;
        autoindex_localtime  on;
    }

    # ---------- 项目 README（数据来源与声明），浏览器内直接看 ----------
    location = /README.md {
        root         /opt/public-apis-playground/site;
        default_type "text/plain; charset=utf-8";
        add_header   X-Content-Type-Options nosniff;
    }

    # ---------- 开源协议文件，浏览器内直接看 ----------
    location ~ ^/(LICENSE|LICENSE-public-apis|NOTICE\.md)$ {
        root         /opt/public-apis-playground/site;
        default_type "text/plain; charset=utf-8";
        add_header   X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location = /healthz {
        default_type text/plain;
        return 200 "ok public-apis-playground\n";
    }
}

# ================================================================
# 443：HTTPS
#   default_server —— 让它接住「裸 IP / 未知 SNI」的请求，这样域名还没
#   解析或还没备案时，用 https://<服务器IP>/ 也能访问本站。
#   ⚠️ 如果这台机器上还有别的站点，且不希望本站接管未知 SNI 请求，
#      把下面两行的 default_server 删掉即可。
#   已有站点靠 server_name 精确匹配，优先级高于 default_server，
#   因此它们的访问完全不受影响。
# ================================================================
server {
    # nginx 1.25.1 以前必须写成 listen ... http2（独立 `http2 on;` 会报
    # unknown directive）；1.25.1+ 两种写法都兼容，故沿用此写法。
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name __DOMAIN__ __DOMAIN_ALT__;

    access_log  /var/log/nginx/__DOMAIN__.access.log;
    error_log   /var/log/nginx/__DOMAIN__.error.log;

    ssl_certificate     __SSLCERT__;
    ssl_certificate_key __SSLKEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /opt/public-apis-playground/site;
    index index.html;
    charset utf-8;

    location = /api/proxy {
        proxy_pass         http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_buffering       off;
        add_header         Cache-Control "no-store" always;
    }

    location /scripts/ {
        alias      /opt/public-apis-playground/scripts/;
        autoindex  on;
        autoindex_exact_size off;
        autoindex_localtime  on;
        types { text/plain py; }
        default_type text/plain;
        charset utf-8;
    }

    location /data/ {
        alias      /opt/public-apis-playground/data/;
        autoindex  on;
        autoindex_exact_size off;
        autoindex_localtime  on;
    }

    # ---------- 项目 README（数据来源与声明），浏览器内直接看 ----------
    location = /README.md {
        root         /opt/public-apis-playground/site;
        default_type "text/plain; charset=utf-8";
        add_header   X-Content-Type-Options nosniff;
    }

    # ---------- 开源协议文件，浏览器内直接看 ----------
    location ~ ^/(LICENSE|LICENSE-public-apis|NOTICE\.md)$ {
        root         /opt/public-apis-playground/site;
        default_type "text/plain; charset=utf-8";
        add_header   X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location = /healthz {
        default_type text/plain;
        return 200 "ok public-apis-playground\n";
    }
}

